allocation_intent:
  allocation_id: alloc_2026_05_20_001
  version: "0.1.1"
  status: sample

  description: >
    Sample allocation intent prepared by Royalty OS before translation
    into payment-rail-compatible instructions.

  origin:
    origin_reference: origin_kazene_question_001
    origin_type: question
    title: "Can value generated by questions circulate back to its source?"
    source_layer: wood
    note: >
      The origin represents a question, structure, or seismic source that
      generated downstream resonance and trace records.

  trace_context:
    trace_reference: trace_kazene_value_circulation_001
    trace_type:
      - structural_reference
      - influence_trace
      - conceptual_reuse
    trace_quality: medium
    evidence_summary: >
      The allocation is based on recorded structural influence and conceptual
      reuse across downstream documents, discussions, or system designs.
    related_references:
      - kazene_trace_protocol
      - structure_fingerprint
      - seismic_score
      - allocation_readiness

  contribution:
    contributor_reference: contributor_shidenkai_alpha
    contributor_type: human_creator
    contribution_description: >
      Original conceptual structure connecting questions, trace, allocation,
      and payment circulation into a Royalty OS-compatible bridge model.
    contribution_scope:
      - conceptual_design
      - architecture_definition
      - terminology
      - value_circulation_model
    contribution_confidence: 0.82

  scoring:
    scoring_reference: score_value_circulation_001
    scoring_type:
      - impact_score
      - seismic_score
    score_value: 0.76
    score_scale: "0.0-1.0"
    confidence: 0.74
    uncertainty_notes: >
      This sample score is illustrative. It does not represent a finalized
      measurement or enforceable allocation.

  allocation:
    allocation_value:
      type: share
      value: 0.15
      unit: ratio
    allocation_basis:
      - trace_context
      - contribution_scope
      - scoring_reference
      - review_status
    allocation_notes: >
      This allocation represents a proposed share for value circulation.
      It is not a legal ownership claim and does not execute payment by itself.

  review:
    review_status: approved_for_sample
    review_type:
      - human_review
      - architecture_review
    reviewer_reference: reviewer_sample_001
    reviewed_at: "2026-05-20T00:00:00Z"
    review_notes: >
      Approved only as a sample object demonstrating how allocation intent
      may be structured before reaching the Payment Rail Bridge.

  dispute:
    dispute_status: none
    dispute_reference: null
    correction_path_available: true
    dispute_notes: >
      No dispute is attached to this sample. Real implementations should
      preserve dispute, reversal, correction, or supersession paths.

  payment_eligibility:
    status: pending_bridge_translation
    reason: >
      Allocation intent has been prepared but has not yet been converted
      into payment-rail-compatible instructions.
    eligible_for_direct_payment: false

  payment_rail_candidate:
    rail_candidate_id: xmoney_candidate
    rail_name: XMoney
    rail_status: candidate
    official_integration: false
    layer: water
    note: >
      XMoney is used here only as one possible payment-rail candidate.
      This sample does not claim official integration.

  bridge_metadata:
    bridge_id: bridge_sample_001
    bridge_layer: payment_rail_bridge
    input_type: allocation_intent
    output_type: payment_rail_instruction_candidate
    preserves:
      - origin_reference
      - trace_reference
      - scoring_reference
      - allocation_id
      - review_status
      - dispute_status
      - payment_eligibility
    created_at: "2026-05-20T00:00:00Z"
    updated_at: "2026-05-20T00:00:00Z"

  settlement:
    settlement_status: not_sent
    settlement_reference: null
    settlement_notes: >
      No payment has been executed. This object only represents allocation
      intent before payment rail translation.

  safety_notes:
    - This sample does not execute payment.
    - This sample does not determine legal ownership.
    - This sample does not claim official XMoney integration.
    - This sample should not bypass review, dispute, compliance, or KYC.
    - This sample demonstrates trace-aware allocation intent only.
